version: '3.8'

services:
  db:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taskhub_dev
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: build  # Use build stage for development
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=taskhub_dev;Username=postgres;Password=postgres
    volumes:
      - ./apps/api:/src
      - ${HOME}/.nuget/packages/:/root/.nuget/packages/
    ports:
      - "5000:5000"
    command: dotnet watch run --urls http://0.0.0.0:5000

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: builder  # Use builder stage for development
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: pnpm dev
